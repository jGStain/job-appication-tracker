<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <title>Job Application Tracker</title>
</head>
<body>
    <header class="app_header">
        <button class="app_header_menu" aria-label="Open menu">
            ☰
        </button>

        <h1 class="app_header_title">Job Tracker</h1>

        <button class="app_header_add" aria-label="Add application">
            +
        </button>
    </header>

    <main>

        <h2 class="applications_title">Applications</h2>

        <div class="search_controls_container">
            <input 
                class="application_search"
                type="search" 
                placeholder="Search applications" 
                aria-label="Application search field">
            <button class="application_search_btn" aria-label="Filter applications">
                ☰
            </button>
        </div>

        <div class="status_container">
            <button class="status_filter active">All 24</button>
            <button class="status_filter">Interested 2</button>
            <button class="status_filter">Applied 12</button>
            <button class="status_filter">Interview 6</button>
            <button class="status_filter">Offer 2</button>
            <button class="status_filter">Rejected 4</button>
        </div>

    </main>
    
</body>
</html>
