<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="https://kit.fontawesome.com/052a045632.js" crossorigin="anonymous"></script>
    <title>Job Application Tracker</title>
</head>
<body>
    <header class="app_header">
        <button class="app_header_menu" aria-label="Open menu">
            ☰
        </button>

        <h1 class="app_header_title">Job Tracker</h1>

        <button class="app_header_add" aria-label="Add application">
            +
        </button>
    </header>

    <main>

        <h2 class="applications_title">Applications</h2>

        <div class="search_controls_container">
            <input 
                class="application_search"
                type="search" 
                placeholder="Search applications" 
                aria-label="Application search field">
            <button class="application_search_btn" aria-label="Filter applications">
                ☰
            </button>
        </div>

        <div class="status_container">
            <button class="status_filter active">All 24</button>
            <button class="status_filter">Interested 2</button>
            <button class="status_filter">Applied 12</button>
            <button class="status_filter">Interview 6</button>
            <button class="status_filter">Offer 2</button>
            <button class="status_filter">Rejected 4</button>
        </div>

        <section class="stats_section">
            <div class="stats_card">
                <h3 class="stats_card_title">Total</h3>
                <p class="stats_card_value">24</p>
                <p class="stats_card_detail">All time</p>
                <div class="stats_card_icon">
                    <i class="fa-regular fa-clipboard" aria-hidden="true"></i>
                </div>
            </div>
            <div class="stats_card">
                <h3 class="stats_card_title">Applied</h3>
                <p class="stats_card_value">12</p>
                <p class="stats_card_detail">50%</p>
                <div class="stats_card_icon">
                    <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
                </div>
            </div>
            <div class="stats_card">
                <h3 class="stats_card_title">Interview</h3>
                <p class="stats_card_value">6</p>
                <p class="stats_card_detail">25%</p>
                <div class="stats_card_icon">
                    <i class="fa-solid fa-user-group" aria-hidden="true"></i>
                </div>
            </div>
            <div class="stats_card">
                <h3 class="stats_card_title">Offers</h3>
                <p class="stats_card_value">2</p>
                <p class="stats_card_detail">8%</p>
                <div class="stats_card_icon">
                    <i class="fa-solid fa-check" aria-hidden="true"></i>
                </div>
            </div>
            <div class="stats_card">
                <h3 class="stats_card_title">Rejected</h3>
                <p class="stats_card_value">4</p>
                <p class="stats_card_detail">17%</p>
                <div class="stats_card_icon">
                    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                </div>
            </div>
        </section>

        <section class="applications_section">
            <h2 class="applications_section_title">Recent Applications</h2>

            <div class="applications_section_card">
                <div class="applications_company_logo">
                    AC
                </div>
                <div class="applications_card_info">
                    <div class="applications_card_heading">
                        <h3 class="applications_card_title">Front-End Developer</h3>
                        <p class="applications_card_status">Interview</p>
                    </div>
                    <p class="applications_card_name">Acme Digital</p>
                    <div class="applications_card_meta">
                        <p class="applications_card_date">10 Aug 2026</p>
                        <span aria-hidden="true">•</span>
                        <p class="applications_card_notes">Second Interview Friday</p>
                    </div>
                </div>
                <button class="applications_card_menu" aria-label="Application options">
                    <i class="fa-solid fa-ellipsis-vertical" aria-hidden="true"></i>
                </button>
            </div>
        </section>

    </main>
    
</body>
</html>
